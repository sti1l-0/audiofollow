[workspace]
resolver = "2"
members = ["crates/af-core", "crates/audiofollow"]
# 可行性验证用的 spike 是独立小工程，不纳入 workspace（避免拉高整体构建时间）
exclude = ["spikes/com-spike", "spikes/tray-spike", "reference"]

[workspace.package]
version = "0.1.2"
edition = "2021"
license = "MIT OR Apache-2.0"
authors = ["sti1l"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
# 托盘常驻程序：优先稳定性与体积，放开 LTO
lto = "thin"
codegen-units = 1
strip = true
# 刻意**不**设 panic = "abort"：主循环的定时器回调浓缩了全部运行逻辑，一处
# panic 直接杀进程会跳过「退出时还原音频路由」的承诺。保留栈展开才能用
# catch_unwind 接住 panic、留痕、继续跑（见 ui.rs 定时器回调）——
# 这比二进制小几百 KB 重要。
